# Render Blueprint for the Ready2Rent API on Render's FREE tier.
#   Django web service (free) + Key Value / Redis (free).
#   PostgreSQL and uploaded files live on Supabase (free); see docs/DEPLOY.md.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Values marked `sync: false` are prompted for once, when the Blueprint is first created.
# Never put real secrets in this file.

services:
  - type: web
    name: ready2rent-api
    runtime: python
    region: oregon                 # keep close to the Supabase project region (US West / Oregon)
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free services have no pre-deploy step, so migrations and expired-token cleanup run in one
    # process at startup (both are idempotent), then gunicorn starts. One worker with threads
    # fits the free instance's memory.
    startCommand: python manage.py release && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /api/livez/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY              # 50+ random characters, generated locally
        sync: false
      - key: DJANGO_ADMIN_URL               # non-obvious admin path, e.g. staff-1a2b3c4d/
        sync: false
      - key: CSRF_TRUSTED_ORIGINS           # the Vercel site origin, e.g. https://ready2rent.vercel.app
        sync: false
      - key: FRONTEND_URL                   # same Vercel URL; used for links inside emails
        sync: false
      - key: DATABASE_URL                   # Supabase SESSION POOLER URI (IPv4), ends in ?sslmode=require
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL       # https://<project-ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: SUPABASE_S3_REGION             # the Supabase project region, e.g. us-west-2
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET        # private bucket for uploaded documents
        value: documents
      - key: DJANGO_USE_X_FORWARDED_PROTO
        value: "true"
      - key: DJANGO_NUM_PROXIES             # 0 = throttle on the full forwarded chain (no shared buckets)
        value: "0"
      - key: CELERY_TASK_ALWAYS_EAGER       # no worker on the free tier: tasks run in-process
        value: "true"
      - key: EMAIL_BACKEND                  # console: emails appear in the service logs
        value: django.core.mail.backends.console.EmailBackend
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ready2rent-redis
          property: connectionString

  - type: keyvalue
    name: ready2rent-redis
    region: oregon
    plan: free                     # 25 MB, not persisted: cache and rate-limit counters only
    maxmemoryPolicy: volatile-lru
    ipAllowList: []                # private network only
